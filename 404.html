<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Página não encontrada</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:32px;display:grid;place-items:center;
         font-family:Arial,Helvetica,sans-serif;color:#202124;background:#fff;text-align:center}
    main{max-width:480px}
    .number{font-size:clamp(100px,20vw,160px);line-height:1;color:#dadce0;font-weight:700}
    h1{font-size:27px;font-weight:500;margin:18px 0 14px}
    p{color:#5f6368;font-size:15px;line-height:1.6;margin:0}
  </style>
</head>
<body><main><div class="number" aria-hidden="true">404</div>
<h1>Página não encontrada</h1>
<p>A página que você está tentando acessar não foi encontrada.</p></main></body>
</html>
